services:
  postgres:
    image: postgres:16-alpine
    container_name: practical7_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cdc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_p7_data:/var/lib/postgresql/data
      - ./sql/01_init_cdc_schema.sql:/docker-entrypoint-initdb.d/01_init_cdc_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cdc_db"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  postgres_p7_data:
